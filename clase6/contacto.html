    <main>
        <h1>
            <!-- Formulario web --->
            Contacto
            <h2>Escribinos</h2>
            <form action="./contacto.html" class="get">
                <!-- 
                nombre
                telefono
                email
                direccion
                consulta
                tamaño C M G

                -->
                <label for="id-nombre">Nombre:</label>
                <input type="text" name="nombre" id="id-nombre">
                <label for="id-telefono">Teléfono:</label>
                <input type="tel" name="telefono" id="id-telefono">
                <label for="id-mail">Email:</label>
                <input type="email" name="mail" id="id-mail">
                <label for="id-tamaño">Tamaño:</label>
                <select name="tamaño" id="id-tamaño">
                    <option value="P">Chico</option>
                    <option value="M">Mediano</option>
                    <option value="G">Grande</option>                    
                </select>
                <label for="id-direccion">Dirección:</label>
                <input type="text" name="direccion" id="id-direccion">
                <label for="id-comentarios">Comentarios:</label>
                <textarea name="comentarios" id="id-comentarios"></textarea>
            
                 <input type="submit" value="Enviar">
                 <label for="id-enviar"></label>
            <h2>Escribinos</h2>
